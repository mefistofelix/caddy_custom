---
admin:
  disabled: true
logging:
  logs:
    default:
      encoder:
        format: console
      level: DEBUG
apps:
  http:
    http_port: 80
    https_port: 443
    servers:
      srv0:
        listen:
        - tcp4/0.0.0.0:443
        routes:
        - handle:
          - handler: vars
            roots_base: "/var/www"
        - match:
          - header_regexp:
              Host:
                pattern: "^.*?\\d+\\.\\d+\\.\\d+\\.\\d+([\\.\\w]+)?(:\\d+)?$"
          handle:
          - handler: vars
            root_name: main
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host.labels.1}/"
          handle:
          - handler: vars
            root_name: "{http.request.host.labels.1}"
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host.labels.1}.{http.request.host.labels.0}/"
          handle:
          - handler: vars
            root_name: "{http.request.host.labels.1}.{http.request.host.labels.0}"
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host}/"
          handle:
          - handler: vars
            root_name: "{http.request.host}"
        - handle:
          - handler: vars
            root: "{http.vars.roots_base}/{http.vars.root_name}/public"
        - match:
          - path_regexp:
              pattern: "\\.(jpg|jpeg|png|webp|gif|avif|ico|svg|css|js|gz|eot|ttf|otf|woff|woff2|pdf)$"
          handle:
          - handler: headers
            response:
              set:
                Cache-Control:
                - max-age=31536000,public,immutable
        - handle:
          - handler: headers
            response:
              deferred: true
              delete:
              - Server
        - match:
          - file:
              try_files:
              - "/offline.html"
              - "{http.request.uri.path}"
          handle:
          - handler: rewrite
            uri: "{http.matchers.file.relative}"
        - match:
          - file:
              try_files:
              - "/.htpasswd"
          handle:
          - handler: authentication
            providers:
              http_basic:
                accounts:
                - password: "REPLACE_WITH_BCRYPT_HASH"
                  username: example-user
                hash:
                  algorithm: bcrypt
                hash_cache: {}
        - handle:
          - encodings:
              gzip: {}
            handler: encode
            prefer:
            - gzip
          - encodings:
              gzip: {}
              zstd: {}
            handler: encode
            prefer:
            - zstd
            - gzip
          - handler: subroute
            routes:
            - handle:
              - handler: static_response
                headers:
                  Location:
                  - "{http.request.orig_uri.path}/"
                status_code: 308
              match:
              - file:
                  try_files:
                  - "{http.request.uri.path}/index.php"
                not:
                - path:
                  - "*/"
            - group: group0
              handle:
              - handler: rewrite
                uri: "{http.matchers.file.relative}"
              match:
              - file:
                  split_path:
                  - ".php"
                  try_files:
                  - "{http.request.uri.path}"
                  - "{http.request.uri.path}/index.php"
                  - index.php
            - handle:
              - handler: proxy_cache
            - handle:
              - handler: reverse_proxy
                transport:
                  protocol: fastcgi
                  split_path:
                  - ".php"
                upstreams:
                - dial: unix//run/php-fpm-{http.vars.root_name}.sock
              match:
              - path:
                - "*.php"
          - handler: file_server
            hide:
            - "*/.*"
            - "./Caddyfile"
            index_names:
            - index.html
        tls_connection_policies:
        - {}
        automatic_https:
          disable_redirects: true
      srv1:
        listen:
        - tcp4/0.0.0.0:80
        routes:
        - handle:
          - handler: vars
            roots_base: "/var/www"
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host}/"
          handle:
          - handler: vars
            root_name: "{http.request.host}"
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host.labels.1}.{http.request.host.labels.0}/"
          handle:
          - handler: vars
            root_name: "{http.request.host.labels.1}.{http.request.host.labels.0}"
        - match:
          - file:
              root: "{http.vars.roots_base}"
              try_files:
              - "{http.request.host.labels.1}/"
          handle:
          - handler: vars
            root_name: "{http.request.host.labels.1}"
        - match:
          - header_regexp:
              Host:
                pattern: "^.*?\\d+\\.\\d+\\.\\d+\\.\\d+([\\.\\w]+)?(:\\d+)?$"
          handle:
          - handler: vars
            root_name: main
        - handle:
          - handler: vars
            root: "{http.vars.roots_base}/{http.vars.root_name}/public"
        - match:
          - path_regexp:
              pattern: "\\.(jpg|jpeg|png|webp|gif|avif|ico|svg|css|js|gz|eot|ttf|otf|woff|woff2|pdf)$"
          handle:
          - handler: headers
            response:
              set:
                Cache-Control:
                - max-age=31536000,public,immutable
        - handle:
          - handler: headers
            response:
              deferred: true
              delete:
              - Server
        - match:
          - file:
              try_files:
              - "/offline.html"
              - "{http.request.uri.path}"
          handle:
          - handler: rewrite
            uri: "{http.matchers.file.relative}"
        - match:
          - file:
              try_files:
              - "/.htpasswd"
          handle:
          - handler: authentication
            providers:
              http_basic:
                accounts:
                - password: "REPLACE_WITH_BCRYPT_HASH"
                  username: example-user
                hash:
                  algorithm: bcrypt
                hash_cache: {}
        - handle:
          - encodings:
              gzip: {}
            handler: encode
            prefer:
            - gzip
          - encodings:
              gzip: {}
              zstd: {}
            handler: encode
            prefer:
            - zstd
            - gzip
          - handler: subroute
            routes:
            - handle:
              - handler: static_response
                headers:
                  Location:
                  - "{http.request.orig_uri.path}/"
                status_code: 308
              match:
              - file:
                  try_files:
                  - "{http.request.uri.path}/index.php"
                not:
                - path:
                  - "*/"
            - group: group0
              handle:
              - handler: rewrite
                uri: "{http.matchers.file.relative}"
              match:
              - file:
                  split_path:
                  - ".php"
                  try_files:
                  - "{http.request.uri.path}"
                  - "{http.request.uri.path}/index.php"
                  - index.php
            - handle:
              - handler: proxy_cache
            - handle:
              - handler: reverse_proxy
                transport:
                  protocol: fastcgi
                  split_path:
                  - ".php"
                upstreams:
                - dial: unix//run/php-fpm-{http.vars.root_name}.sock
              match:
              - path:
                - "*.php"
          - handler: file_server
            hide:
            - "*/.*"
            - "./Caddyfile"
            index_names:
            - index.html
        automatic_https:
          disable_redirects: true
  tls:
    automation:
      policies:
      - on_demand: true
      on_demand:
        permission:
          endpoint: http://127.0.0.1:19000/caddy_on_demand_tls
          module: http
